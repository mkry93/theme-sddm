[General]

### GENERAL

# path to the wallpaper. you can drop files in backgrounds/ to use a relative path, or you can just use an absolute path.
Background="backgrounds/tele.jpg"

# the font to use throughout the theme. use the name of the font family.
Font="SF Pro Rounded"
FontFile="sf-pro-rounded.ttf"

# the distance that stuff should be from the screen edge.
Padding="50"

# specify how round corners should be, or set to 0 to disable rounded corners.
CornerRadius="28"

# the font size used for everything excluding the date and time.
GeneralFontSize="12"

# this allows you to adjust the relative scale of UI elements. you should probably keep the value below 1.
LoginScale="0.175"

### USER PICTURE

# the width of the outline around the user avatar. set to 0 to disable.
UserPictureBorderWidth="3"

# the color of the outline around the user avatar (Harmonized Grass Green).
UserPictureBorderColor="#3fd965"

# the color of the default, blank avatar.
UserPictureColor="#111719"

### TEXT FIELD (USER AND PASSWORD)

# the color of the text field background for the user and password fields (Surface Container).
TextFieldColor="#1c2427"

# the color of the text inside the user and password fields.
TextFieldTextColor="#f2f5f6"

# the color of the border around the currently selected text field (Primary Accent Red).
TextFieldHighlightColor="#f93e37"

# the border width of the currently selected text field. set to 0 to disable the border.
TextFieldHighlightWidth="3"

# the placeholder text shown in the user field when nothing is typed.
UserFieldBgText="User"

# the placeholder text shown in the password field when nothing is typed.
PasswordFieldBgText="Password"

### LOGIN BUTTON

# the color of the login button text.
LoginButtonTextColor="#111719"

# the color of the login button background (Primary Filled Button).
LoginButtonBgColor="#3fd965"

# the text to be displayed on the login button.
LoginButtonText="Login"

### POPUP (POWER, SESSION, AND USER)

# the background color of the popup. this applies to the power panel, session panel, and user panel.
PopupBgColor="#111719"

# the color of the currently selected entry in the popup.
PopupHighlightColor="#3fd965"

# the color of the text for the currently selected option.
PopupHighlightedTextColor="#111719"

### SESSION BUTTON

# the color of the session button background.
SessionButtonColor="#1c2427"

# the color of the icon inside the session button.
SessionIconColor="#9aa8ab"

### POWER BUTTON

# the color of the power button background.
PowerButtonColor="#1c2427"

# the color of the power button background (Subtle tint of red for destructive action).
PowerIconColor="#f93e37"

### DATE

# the text color of the date (Muted tonal grey-green for hierarchy).
DateColor="#9aa8ab"

# the font size of the date.
DateSize="40"

# whether the date is bolded. accepts either `true` or `false`.
DateIsBold="true"

# the opacity of the date.
DateOpacity="0.9"

# specify the formatting of the date.
DateFormat="dddd, MMMM d"

### TIME

# the text color of the time (Pure white for primary visual anchor).
TimeColor="#ffffff"

# the font size of the time (Scaled up for extreme standout).
TimeSize="56"

# whether the time is bolded. accepts either `true` or `false`.
TimeIsBold="true"

# the opacity of the time text.
TimeOpacity="1.0"

# specify the formatting of the time.
TimeFormat="hh:mm AP"